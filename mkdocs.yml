site_name: Bernardo Stearns Blog
site_url: https://berstearns.github.io/
docs_dir: src
site_dir: docs

theme:
  name: material
  favicon: assets/luffyfavicon.ico
  custom_dir: overrides
  palette:
    scheme: dracula
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

hooks:
  - hooks/hide_private.py
  - hooks/nojekyll.py
  - hooks/cache_bust.py

extra:
  private_code: "opensesame"

extra_css:
  - assets/css/dracula.css
  - assets/css/portfolio.css

extra_javascript:
  - assets/js/portfolio.js
  - assets/js/tag-filter.js

plugins:
  - search
  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      # one page: the client-side tag filter must see every post card
      pagination_per_page: 50
      draft_on_serve: !ENV [DRAFTS, true]
      categories_allowed:
        - General
        - Papers
        - Learning
        - Hindi
        - Projects
        - Snippets
        - Problems
  - tags
  - markmap:
      base_path: mindmaps
      encoding: utf-8
      file_extension: .mm.md
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  # term-highlight strategy: ==mark== ^^ins^^ ~~del~~ ++ctrl+c++
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - def_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Portfolio: portfolio/index.md
  - Blog:
      - blog/index.md
